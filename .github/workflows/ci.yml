name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 编译期检查 feature 接线；Vitis/ROCm 等运行时链接需要供应商提供的 ORT 构建
  features:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, feature: ep-cuda }
          - { os: ubuntu-latest, feature: ep-tensorrt }
          - { os: ubuntu-latest, feature: ep-qnn }
          - { os: ubuntu-latest, feature: ep-openvino }
          - { os: ubuntu-latest, feature: ep-cann }
          - { os: ubuntu-latest, feature: ep-rocm }
          - { os: windows-latest, feature: ep-vitis }
          - { os: windows-latest, feature: ep-directml }
          - { os: windows-latest, feature: ep-nnapi }
          - { os: macos-latest, feature: ep-coreml }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p uniinfer-cli --features ${{ matrix.feature }}

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --manifest-path apps/desktop/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path apps/desktop/Cargo.toml --all-targets -- -D warnings
      - run: cargo check --manifest-path apps/desktop/Cargo.toml

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  outdated:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-outdated
      - run: cargo outdated --workspace

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: bash scripts/e2e/m1_smoke.sh
      - run: bash scripts/e2e/m1_bench.sh
      - run: sha256sum -c sha256.txt
        working-directory: models/tiny-onnx
