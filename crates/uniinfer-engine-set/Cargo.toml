[package]
name = "uniinfer-engine-set"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Default engine composition for UniInfer runtimes"

[features]
default = []
ep-cuda = ["uniinfer-engine-onnx/ep-cuda"]
ep-tensorrt = ["uniinfer-engine-onnx/ep-tensorrt"]
ep-coreml = ["uniinfer-engine-onnx/ep-coreml"]
ep-directml = ["uniinfer-engine-onnx/ep-directml"]
ep-nnapi = ["uniinfer-engine-onnx/ep-nnapi"]
ep-qnn = ["uniinfer-engine-onnx/ep-qnn"]
ep-openvino = ["uniinfer-engine-onnx/ep-openvino"]
ep-rocm = ["uniinfer-engine-onnx/ep-rocm"]
ep-vitis = ["uniinfer-engine-onnx/ep-vitis"]
ep-cann = ["uniinfer-engine-onnx/ep-cann"]
candle-cuda = ["uniinfer-engine-candle/cuda"]
candle-metal = ["uniinfer-engine-candle/metal"]
llama = ["dep:uniinfer-engine-llama", "uniinfer-engine-llama/llama"]
llama-mtmd = ["dep:uniinfer-engine-llama", "uniinfer-engine-llama/mtmd"]
llama-vulkan = ["llama", "uniinfer-engine-llama/vulkan"]
llama-cuda = ["llama", "uniinfer-engine-llama/cuda"]
llama-rocm = ["llama", "uniinfer-engine-llama/rocm"]
llama-metal = ["llama", "uniinfer-engine-llama/metal"]
whisper = ["dep:uniinfer-engine-whisper", "uniinfer-engine-whisper/whisper"]

[dependencies]
uniinfer-core.workspace = true
uniinfer-devices.workspace = true
uniinfer-registry.workspace = true
uniinfer-engine-onnx.workspace = true
uniinfer-engine-process.workspace = true
uniinfer-engine-candle.workspace = true
uniinfer-engine-llama = { workspace = true, optional = true }
uniinfer-engine-whisper = { workspace = true, optional = true }

[lints]
workspace = true
