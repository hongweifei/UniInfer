[package]
name = "uniinfer-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "UniInfer command-line interface"

[features]
default = []
ep-cuda = ["uniinfer-api/ep-cuda"]
ep-tensorrt = ["uniinfer-api/ep-tensorrt"]
ep-coreml = ["uniinfer-api/ep-coreml"]
ep-directml = ["uniinfer-api/ep-directml"]
ep-nnapi = ["uniinfer-api/ep-nnapi"]
ep-qnn = ["uniinfer-api/ep-qnn"]
ep-openvino = ["uniinfer-api/ep-openvino"]
ep-rocm = ["uniinfer-api/ep-rocm"]
ep-vitis = ["uniinfer-api/ep-vitis"]
ep-cann = ["uniinfer-api/ep-cann"]
candle-cuda = ["uniinfer-service/candle-cuda"]
candle-metal = ["uniinfer-service/candle-metal"]
llama = ["uniinfer-api/llama"]
llama-mtmd = ["uniinfer-api/llama-mtmd"]
llama-vulkan = ["uniinfer-api/llama-vulkan"]
llama-cuda = ["uniinfer-api/llama-cuda"]
llama-rocm = ["uniinfer-api/llama-rocm"]
whisper = ["uniinfer-api/whisper"]
onnx-dynamic = ["uniinfer-api/onnx-dynamic"]

[dependencies]
uniinfer-config.workspace = true
uniinfer-core.workspace = true
uniinfer-model-inspect.workspace = true
uniinfer-service.workspace = true
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[[bin]]
name = "uniinfer"
path = "src/main.rs"

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
# DirectML is the baseline accelerator for every Windows distribution.
uniinfer-api = { workspace = true, features = ["ep-directml"] }

[target.'cfg(not(windows))'.dependencies]
uniinfer-api.workspace = true
