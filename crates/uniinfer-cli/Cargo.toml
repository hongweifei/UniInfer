[package]
name = "uniinfer-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
ep-cuda = ["uniinfer-engine-onnx/ep-cuda", "uniinfer-api/ep-cuda"]
ep-tensorrt = ["uniinfer-engine-onnx/ep-tensorrt", "uniinfer-api/ep-tensorrt"]
ep-coreml = ["uniinfer-engine-onnx/ep-coreml", "uniinfer-api/ep-coreml"]
ep-directml = ["uniinfer-engine-onnx/ep-directml", "uniinfer-api/ep-directml"]
ep-nnapi = ["uniinfer-engine-onnx/ep-nnapi", "uniinfer-api/ep-nnapi"]
ep-qnn = ["uniinfer-engine-onnx/ep-qnn", "uniinfer-api/ep-qnn"]
ep-openvino = ["uniinfer-engine-onnx/ep-openvino", "uniinfer-api/ep-openvino"]
ep-cann = ["uniinfer-engine-onnx/ep-cann", "uniinfer-api/ep-cann"]

[dependencies]
uniinfer-core.workspace = true
uniinfer-devices.workspace = true
uniinfer-registry.workspace = true
uniinfer-engine-onnx.workspace = true
uniinfer-backends.workspace = true
uniinfer-api.workspace = true
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[[bin]]
name = "uniinfer"
path = "src/main.rs"

[lints]
workspace = true
