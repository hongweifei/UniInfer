[package]
name = "uniinfer-engine-llama"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "llama.cpp engine for GGUF models"

[features]
default = []
llama = ["dep:llama-cpp-2", "dep:uniinfer-core", "dep:self_cell", "dep:tracing"]
vulkan = ["llama", "llama-cpp-2/vulkan"]
cuda = ["llama", "llama-cpp-2/cuda"]
rocm = ["llama", "llama-cpp-2/rocm"]
metal = ["llama", "llama-cpp-2/metal"]
opencl = ["llama", "llama-cpp-2/opencl"]

[dependencies]
uniinfer-core = { workspace = true, optional = true }
llama-cpp-2 = { version = "0.1.161", optional = true }
self_cell = { version = "1", optional = true }
tracing = { workspace = true, optional = true }

[lints]
workspace = true
