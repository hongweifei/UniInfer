[package]
name = "uniinfer-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "OpenAI-compatible HTTP API"

[features]
default = []
ep-cuda = ["uniinfer-service/ep-cuda"]
ep-tensorrt = ["uniinfer-service/ep-tensorrt"]
ep-coreml = ["uniinfer-service/ep-coreml"]
ep-directml = ["uniinfer-service/ep-directml"]
ep-nnapi = ["uniinfer-service/ep-nnapi"]
ep-qnn = ["uniinfer-service/ep-qnn"]
ep-openvino = ["uniinfer-service/ep-openvino"]
ep-rocm = ["uniinfer-service/ep-rocm"]
ep-vitis = ["uniinfer-service/ep-vitis"]
ep-cann = ["uniinfer-service/ep-cann"]

[dependencies]
uniinfer-core.workspace = true
uniinfer-service.workspace = true
axum.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[lints]
workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
