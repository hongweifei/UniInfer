[workspace]

[package]
name = "uniinfer-desktop"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hongweifei/UniInfer"
publish = false
description = "UniInfer desktop shell"

[build-dependencies]
tauri-build = { version = "2.7.4" }

[features]
default = []
ep-cuda = ["uniinfer-api/ep-cuda"]
ep-tensorrt = ["uniinfer-api/ep-tensorrt"]
ep-coreml = ["uniinfer-api/ep-coreml"]
ep-directml = ["uniinfer-api/ep-directml"]
ep-nnapi = ["uniinfer-api/ep-nnapi"]
ep-qnn = ["uniinfer-api/ep-qnn"]
ep-openvino = ["uniinfer-api/ep-openvino"]
ep-rocm = ["uniinfer-api/ep-rocm"]
ep-vitis = ["uniinfer-api/ep-vitis"]
ep-cann = ["uniinfer-api/ep-cann"]
candle-cuda = ["uniinfer-api/candle-cuda"]
candle-metal = ["uniinfer-api/candle-metal"]
llama = ["uniinfer-api/llama"]
llama-mtmd = ["uniinfer-api/llama-mtmd"]
llama-vulkan = ["uniinfer-api/llama-vulkan"]
llama-cuda = ["uniinfer-api/llama-cuda"]
llama-rocm = ["uniinfer-api/llama-rocm"]
llama-metal = ["uniinfer-api/llama-metal"]
whisper = ["uniinfer-api/whisper"]

[dependencies]
uniinfer-api = { path = "../../crates/uniinfer-api" }
uniinfer-config = { path = "../../crates/uniinfer-config" }
tauri = { version = "2.12.5" }
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
serde = { version = "1.0.229", features = ["derive"] }
hex = "0.4.3"
getrandom = "0.4.3"
rfd = "0.15"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
