<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UniInfer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <strong>UniInfer</strong>
      <select id="model" disabled></select>
      <span id="status">正在连接本地运行时…</span>
    </header>
    <main id="messages"></main>
    <form id="composer">
      <textarea id="input" rows="2" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
      <button id="send" type="submit">发送</button>
      <button id="stop" class="secondary" type="button" disabled>停止</button>
    </form>
    <script src="app.js"></script>
  </body>
</html>
