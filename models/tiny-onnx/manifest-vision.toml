schema_version = 1
id = "tiny-vision-onnx"
format = "onnx"
quantization = "fp32"
modalities = ["text", "image"]
streaming_capable = false
context_len = 64
tokenizer = "bytes"
min_vram = "0GiB"

[placement]
policy = "auto"
prefer = ["npu", "gpu", "cpu"]
allow_cpu_fallback = true

[text]
vocab_size = 256

[vision]
architecture = "onnx_vlm"
image_token = "<image>"

