id = "tiny-byte-onnx-2"
runtime = "onnx"
implementation = "onnx.graph"
format = "onnx"
quantization = "fp32"
modalities = ["text"]
capabilities = ["text_generation"]
streaming_capable = false
context_len = 64
tokenizer = "bytes"
min_vram = "0GiB"

[placement]
policy = "auto"
prefer = ["npu", "gpu", "cpu"]
allow_cpu_fallback = true

[text]
vocab_size = 256

