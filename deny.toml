[graph]
all-features = false

[advisories]
version = 2
# paste is archived upstream, but candle/gemm and tokenizers still depend on
# it and no safe upgrade exists yet. Revisit when candle or tokenizers drops it.
ignore = ["RUSTSEC-2024-0436"]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "Unlicense",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
