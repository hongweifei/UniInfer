[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["apps/desktop"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/hongweifei/UniInfer"

[workspace.dependencies]
uniinfer-core = { version = "0.0.0", path = "crates/uniinfer-core" }
uniinfer-config = { version = "0.0.0", path = "crates/uniinfer-config" }
uniinfer-model-inspect = { version = "0.0.0", path = "crates/uniinfer-model-inspect" }
uniinfer-devices = { version = "0.0.0", path = "crates/uniinfer-devices" }
uniinfer-registry = { version = "0.0.0", path = "crates/uniinfer-registry" }
uniinfer-router = { version = "0.0.0", path = "crates/uniinfer-router" }
uniinfer-service = { version = "0.0.0", path = "crates/uniinfer-service" }
uniinfer-engine-onnx = { version = "0.0.0", path = "crates/uniinfer-engine-onnx" }
uniinfer-engine-candle = { version = "0.0.0", path = "crates/uniinfer-engine-candle" }
uniinfer-engine-llama = { version = "0.0.0", path = "crates/uniinfer-engine-llama" }
uniinfer-engine-whisper = { version = "0.0.0", path = "crates/uniinfer-engine-whisper" }
uniinfer-engine-set = { version = "0.0.0", path = "crates/uniinfer-engine-set" }
uniinfer-engine-process = { version = "0.0.0", path = "crates/uniinfer-engine-process" }
uniinfer-backends = { version = "0.0.0", path = "crates/uniinfer-backends" }
uniinfer-api = { version = "0.0.0", path = "crates/uniinfer-api" }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "api-31", "tracing", "tls-native", "copy-dylibs", "half"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
thiserror = "2.0.21"
sha2 = "0.11.1"
hex = "0.4.3"
clap = { version = "4.5", features = ["derive"] }
axum = { version = "0.8.9", features = ["ws", "multipart"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
tower-http = { version = "0.6", features = ["cors"] }
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
serde_json = "1"
sysinfo = "0.40.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
minijinja = { version = "3", features = ["serde", "json"] }
minijinja-contrib = { version = "3", features = ["pycompat"] }
anyhow = "1"
tempfile = "3"
hound = "3.5.1"
half = "2"
rustfft = "6.4.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
