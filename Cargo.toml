[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hongweifei/UniInfer"

[workspace.dependencies]
uniinfer-core = { path = "crates/uniinfer-core" }
uniinfer-devices = { path = "crates/uniinfer-devices" }
uniinfer-registry = { path = "crates/uniinfer-registry" }
uniinfer-engine-onnx = { path = "crates/uniinfer-engine-onnx" }
uniinfer-backends = { path = "crates/uniinfer-backends" }
ort = "=2.0.0-rc.15"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
thiserror = "2.0.21"
sha2 = "0.11.1"
hex = "0.4.3"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
