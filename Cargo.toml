[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hongweifei/UniInfer"

[workspace.dependencies]
uniinfer-core = { path = "crates/uniinfer-core" }
uniinfer-devices = { path = "crates/uniinfer-devices" }
uniinfer-registry = { path = "crates/uniinfer-registry" }
uniinfer-service = { path = "crates/uniinfer-service" }
uniinfer-engine-onnx = { path = "crates/uniinfer-engine-onnx" }
uniinfer-backends = { path = "crates/uniinfer-backends" }
uniinfer-api = { path = "crates/uniinfer-api" }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "api-31", "tracing", "tls-native", "copy-dylibs"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
thiserror = "2.0.21"
sha2 = "0.11.1"
hex = "0.4.3"
clap = { version = "4.5", features = ["derive"] }
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde_json = "1"
sysinfo = "0.40.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
